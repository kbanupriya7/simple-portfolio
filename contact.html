<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="favicon.png">
    <title>Contact form</title>
    <link href="https://fonts.googleapis.com/css2?family=Young+Serif&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="contact-section">
        <div class="section-one">
            <h1 class="section-one__name" id="name-heading">BANUPRIYA</h1>
            <p class="section-one__position">Frontend Developer</p>
            <a href="index.html" class="section-one__contact">Home</a>
        </div>

        <form class="contact-form">
            <table>
                <tr>
                    <td class="contact-form__label">Name</td>
                    <td><input type="text" class="contact-form__input"></td>
                </tr>

                <tr>
                    <td class="contact-form__label">email</td>
                    <td><input type="email" class="contact-form__input"></td>
                </tr>
                <tr>
                    <td class="contact-form__label">Contact</td>
                    <td><input type="tel" class="contact-form__input"></td>
                </tr>
                <tr>
                    <td class="contact-form__label">Message</td>
                    <td><textarea name="message" id="message-id" class="contact-form__textarea"></textarea></td>
                </tr>
                <tr>
                    <td><input type="submit" class="contact-form__submit"></td>
                </tr>

            </table>
        </form>
        <div class="footer">
            <p class="footer__list">Social media:
                <a href="https://github.com/kbanupriya7">Github</a>
                <a href="https://www.linkedin.com/in/banupriya-krishnasamy7">LinkedIn</a>
            </p>
            <p class="footer__description">&copy; BANUPRIYA</p>
        </div>


    </div>

</body>

</html>
